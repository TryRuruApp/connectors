<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="yellowHeader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFDE2F"/>
      <stop offset="100%" stop-color="#F5BA00"/>
    </linearGradient>
    <linearGradient id="paperBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F4F6"/>
    </linearGradient>
    <clipPath id="squircleClip">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>
  <g clip-path="url(#squircleClip)">
    <!-- White Paper Body -->
    <rect x="0" y="0" width="512" height="512" fill="url(#paperBody)"/>
    <!-- Yellow Top Header -->
    <rect x="0" y="0" width="512" height="138" fill="url(#yellowHeader)"/>
    <!-- Perforation Dots Row -->
    <g fill="#A69B82" opacity="0.6">
      <circle cx="34" cy="148" r="5.5"/>
      <circle cx="67" cy="148" r="5.5"/>
      <circle cx="100" cy="148" r="5.5"/>
      <circle cx="133" cy="148" r="5.5"/>
      <circle cx="166" cy="148" r="5.5"/>
      <circle cx="199" cy="148" r="5.5"/>
      <circle cx="232" cy="148" r="5.5"/>
      <circle cx="265" cy="148" r="5.5"/>
      <circle cx="298" cy="148" r="5.5"/>
      <circle cx="331" cy="148" r="5.5"/>
      <circle cx="364" cy="148" r="5.5"/>
      <circle cx="397" cy="148" r="5.5"/>
      <circle cx="430" cy="148" r="5.5"/>
      <circle cx="463" cy="148" r="5.5"/>
      <circle cx="496" cy="148" r="5.5"/>
    </g>
    <!-- Ruled Line 1 -->
    <rect x="64" y="252" width="384" height="12" rx="6" fill="#B0B0B5"/>
    <!-- Ruled Line 2 -->
    <rect x="64" y="380" width="384" height="12" rx="6" fill="#B0B0B5"/>
  </g>
</svg>
